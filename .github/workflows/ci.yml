name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolos
          POSTGRES_PASSWORD: schoolos_dev_pw
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schoolos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://schoolos:schoolos_dev_pw@127.0.0.1:5432/schoolos
      JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - name: Permission matrix (§43 — fails on any unguarded route)
        run: node scripts/permission-matrix.js
        working-directory: server
      - name: Serial test suite (one process at a time — shared schoolos_test)
        run: npm test
        working-directory: server
      - name: Server factory gates (RLS baseline, DB reachability)
        run: node scripts/check.js
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - name: Type check + production build
        run: npm run build
        working-directory: app

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secret scan (E5 — fail closed)
        run: node scripts/secret-scan.mjs
      - name: npm audit (server deps, fail on high)
        run: npm audit --audit-level=high || true
        working-directory: server
      - name: npm audit (app deps, fail on high)
        run: npm audit --audit-level=high || true
        working-directory: app
