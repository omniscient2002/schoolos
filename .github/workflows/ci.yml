name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Engine parity: compose db + every dev/test cluster run Postgres 18 — CI
        # must test the same major, not the 16 the old job shipped. Digest-pinned
        # (backlog: image digest pinning).
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          # The test harness's admin lane (tests/helpers.js `ADMIN`,
          # scripts/bootstrap.js, scripts/ci-init-db.js) connects as `postgres` with
          # NO password over TCP 127.0.0.1:5432 and drops/creates databases — the
          # service container must therefore BE a `postgres` superuser with trust
          # auth. The constrained `schoolos` owner role + app db are provisioned
          # idempotently by scripts/ci-init-db.js (mirrors server/README.md quick
          # start). Fixes the audit's §13 finding: POSTGRES_USER=schoolos shipped a
          # container with no `postgres` role and no `schoolos` database.
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://schoolos:schoolos_dev_pw@127.0.0.1:5432/schoolos
      JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        # TST-14: CI ran Node 22 while the image and every dev/test cluster run Node 26 (Dockerfile
        # `node:26-alpine`; local `node --version` = v26). A suite that passes on a different major than
        # the one that ships is not testing the artifact. Pinned to 26 to match the runtime.
        with: { node-version: 26, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - name: Provision database (role schoolos + db schoolos, idempotent)
        run: node scripts/ci-init-db.js
        working-directory: server
      - name: Validate deployment artifact (compose interpolation + dependency graph)
        run: APP_ROLE_PASSWORD=ci-app-role-password JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef CORS_ORIGINS=http://localhost:4173 docker compose -f docker-compose.yml config --quiet
        working-directory: server
      - name: Syntax-check shipped server modules
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: server
      - name: Migrate the app database (idempotent — gives check.js its baseline)
        run: node scripts/migrate.js
        working-directory: server
      - name: Permission matrix (§43 — fails on any unguarded route)
        run: node scripts/permission-matrix.js
        working-directory: server
      # T207 / FEX-2 / OPSX-11 — UI↔door parity gate, now ENFORCING. Fails CI on any mock-plane import
      # (a screen that fakes writes with no HTTP) or any unreachable write door that is not in the
      # documented API-only allowlist (scripts/parity-gate.js). The mock plane was moved to `demo/` and
      # every live screen using it is labelled sample data, so this is load-bearing, not decorative.
      - name: UI↔door parity gate (T207 / FEX-2 — enforce)
        run: node scripts/parity-gate.js --enforce
        working-directory: server
      - name: Serial test suite (one process at a time — schoolos_test recreated per file)
        # OPSX-11: `set -o pipefail` keeps a red suite failing CI even though the output is piped through
        # `tee`; the log is what the verification-artifact generator reads next.
        run: set -o pipefail; npm test 2>&1 | tee test-run.log
        working-directory: server
      # OPSX-11: regenerate docs/VERIFICATION.md from THIS run's log so the published figures can never
      # drift from the suite. `if: always()` is deliberate — the artifact's own rule 1 is that a red run is
      # still a measurement that must be written, not hidden.
      - name: Generate verification artifact from this run
        if: always()
        run: node scripts/verification-artifact.js --no-run
        working-directory: server
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VERIFICATION.md
          path: docs/VERIFICATION.md
      - name: Server factory gates (DB reachable, migrations applied, RLS baseline)
        run: node scripts/check.js
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      # TST-6 / FE-9: the web package defined `lint` (oxlint) but CI only ran build, so a lint ERROR
      # could merge freely. Gated here. It exits 0 today (warnings only — 118 of them), so this catches
      # NEW errors without demanding the existing warnings be cleared first; tighten to --deny-warnings
      # when the warning backlog is worked down.
      - name: Lint (oxlint — fails on errors; warnings are reported, not gating)
        run: npm run lint
        working-directory: app
      - name: Type check + production build
        run: npm run build
        working-directory: app
      - name: Frontend unit tests
        run: npm test
        working-directory: app

  # OPSX-12 / OPS-1/2 — build and BOOT the shipped image on a FRESH volume and assert the API answers
  # /ready. The unit tests never start the container, so the "one-command boot" contract (migrate →
  # bootstrap ordering, grants, entrypoint) only holds if the artifact itself is exercised. Runs in its
  # own job so it does not collide with the `server` job's 5432 service.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - name: Validate compose interpolation
        run: APP_ROLE_PASSWORD=ci-app-role-password JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef CORS_ORIGINS=http://localhost:4173 docker compose -f docker-compose.yml config --quiet
        working-directory: server
      - name: Build and boot on fresh volumes
        working-directory: server
        env:
          APP_ROLE_PASSWORD: ci-app-role-password
          DB_PASSWORD: ci-db-password
          JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          CORS_ORIGINS: http://localhost:4173
        run: |
          docker compose up -d --build
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/ready >/dev/null 2>&1; then ok=1; echo "ready after ${i}s"; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::the shipped stack never answered /ready"
            docker compose logs --no-color | tail -120
            docker compose down -v
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/ready
          curl -fsS http://127.0.0.1:8080/health
      - name: Tear down
        if: always()
        working-directory: server
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - name: Secret scan (E5 — fail closed)
        run: node scripts/secret-scan.mjs
      # T202: the old steps ended in `|| true` — they could never fail. Production
      # deps only (--omit=dev); no exceptions are currently documented. If a high
      # finding ever needs a temporary waiver, document it INLINE here with its GHSA
      # id + justification and gate on the remainder — never restore `|| true`.
      - name: npm audit (server prod deps — fails the build on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server
      - name: npm audit (app prod deps — fails the build on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: app
