# SchoolOS — full stack (db + api). For local/staging use.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: schoolos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schoolos_dev_pw}
      POSTGRES_DB: schoolos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos -d schoolos"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:5432:5432"]

  api:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://schoolos:${DB_PASSWORD:-schoolos_dev_pw}@db:5432/schoolos
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # config.js refuses CORS_ORIGINS="*" in production — pass the operator's
      # allowlist through (comma-separated); see server/.env.example.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in production}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
    # prod semantics: migrate (idempotent) + serve. NEVER seed in production —
    # seed.js TRUNCATEs tenant data and installs demo credentials. For a local demo
    # stack use `docker compose --profile demo up` which runs the demo-init service.
    command: sh -c "node scripts/bootstrap.js && node scripts/migrate.js && node src/index.js"

  # Wave C: one-shot data-retention pass (Wave B's worker, added here because it
  # did not exist). Non-secret owner cleanup only — GPS positions past their 30-day
  # retention (020), expired/consumed login OTPs from the kernel vault
  # (app.auth_otps, RLS-denied to the app role by 008, hence owner path), expired
  # revoked-token denylist rows (038) and expired pre-auth OAuth states (040).
  # Runs after api healthy so the schema always exists. Plugin-schedule retention
  # (manifest retention.on_uninstall: export_then_purge_30d) is NOT covered —
  # per-plugin purge rules are unimplemented. Re-run manually with:
  #   docker compose run --rm retention
  # Cron alternative (host cron): see the header of scripts/retention-worker.js.
  retention:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WORKER_ROLE: "1" # non-HTTP process: no JWT/CORS surface, skips those guards
      DATABASE_URL: postgres://schoolos:${DB_PASSWORD:-schoolos_dev_pw}@db:5432/schoolos
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: node scripts/retention-worker.js
    restart: "no"

  outbox:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WORKER_ROLE: "1" # non-HTTP process: no JWT/CORS surface, skips those guards
      DATABASE_URL: postgres://schoolos:${DB_PASSWORD:-schoolos_dev_pw}@db:5432/schoolos
    depends_on:
      db:
        condition: service_healthy
      # Waits for the api container (which runs bootstrap+migrate) to be healthy,
      # so on a fresh stack the schema always exists before the first tick.
      api:
        condition: service_healthy
    # The event spine's delivery worker — REQUIRED in every environment, not a
    # demo extra: without it outbox rows are written but never relayed. Poll
    # cadence/backoff are tunable via OUTBOX_* envs (see scripts/outbox-worker.js).
    command: node scripts/outbox-worker.js
    restart: unless-stopped
    # image-level HEALTHCHECK probes :8080/ready, which no worker listens on —
    # silence the permanent "unhealthy" noise (worker liveness = restart policy).
    healthcheck:
      disable: true

  comms-dispatcher:
    build: .
    environment:
      # NODE_ENV=development on purpose (demo-init parity): this worker reads
      # config.js ONLY for DATABASE_URL; staying out of production mode skips the
      # CORS/JWT prod guards that would crash-loop a non-HTTP process — the same
      # reasoning WORKER_ROLE implements for the outbox relay. Retention (Wave B)
      # owns worker prod-hardening; revisit then.
      NODE_ENV: development
      DATABASE_URL: postgres://schoolos:${DB_PASSWORD:-schoolos_dev_pw}@db:5432/schoolos
    depends_on:
      db:
        condition: service_healthy
      # Same ordering contract as the outbox relay: bootstrap+migrate run in the
      # api container, so the 043 dispatch columns must exist before the first
      # poll (the dispatcher also self-ensures them at startup as a guard).
      api:
        condition: service_healthy
    # The Communication Orchestrator's queue drain (Wave A): drains
    # app.communications status='queued' through the rails (rails.sms /
    # rails.whatsapp; log-only for unrail'd channels). REQUIRED wherever comms
    # sends are approved — without it queued rows sit undelivered
    # (docs/DATA-FLOW §20). Poll cadence/backoff tunable via COMMS_* envs
    # (see scripts/comms-dispatcher.js).
    command: node scripts/comms-dispatcher.js
    restart: unless-stopped
    healthcheck:
      disable: true

  demo-init:
    profiles: [demo]
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://schoolos:${DB_PASSWORD:-schoolos_dev_pw}@db:5432/schoolos
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node scripts/bootstrap.js && node scripts/seed.js"
    restart: "no"

volumes:
  pgdata:
