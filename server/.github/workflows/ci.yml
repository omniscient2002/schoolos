name: SchoolOS CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: app
      - run: npx vite build
        working-directory: app
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: schoolos, POSTGRES_PASSWORD: schoolos_dev_pw, POSTGRES_DB: schoolos }
        options: >-
          --health-cmd "pg_isready -U schoolos" --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: node scripts/migrate.js
        working-directory: server
        env: { DATABASE_URL: "postgres://schoolos:schoolos_dev_pw@127.0.0.1:5432/schoolos" }
      - run: node scripts/bootstrap.js
        working-directory: server
        env: { DATABASE_URL: "postgres://schoolos:schoolos_dev_pw@127.0.0.1:5432/schoolos" }
      - run: node scripts/seed.js
        working-directory: server
        env: { DATABASE_URL: "postgres://schoolos:schoolos_dev_pw@127.0.0.1:5432/schoolos" }
      - run: node --test tests/
        working-directory: server
        env: { DATABASE_URL: "postgres://schoolos:schoolos_dev_pw@127.0.0.1:5432/schoolos" }
